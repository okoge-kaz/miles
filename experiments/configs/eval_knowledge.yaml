# Knowledge MCQA eval, for the knowledge-mcqa recipe.
#
# MMLU-Pro is what every Qwen3 and Nemotron card reports, so a number here is
# comparable to a published one.
#
# GPQA is gated, so it is staged separately by setup/prepare_gpqa.sbatch (needs
# HF_TOKEN in .env plus the terms accepted; see .env.example).
#
# Ten options per question rather than MMLU's four, so the chance floor is 0.1
# and `--rm-type gpqa` needs the per-row valid_letters the converter writes into
# metadata.
#
# Cost: 2012 x 4 = 8048 generations per eval interval, but the outputs are short
# (measured p50 406 tokens on knowledge-mcqa), so this is cheaper than one AIME
# pass.

eval:
  defaults:
    n_samples_per_eval_prompt: 4
    max_response_len: 4096
    top_p: 1.0
    rm_type: gpqa

  datasets:
    - name: mmlu_pro
      path: /data/mmlu-pro/mmlu-pro-miles-2k.jsonl

    # 198 questions, so one eval is noisy at n=4 -- 8 samples here, since the
    # published GPQA-Diamond number is the whole reason to carry it.
    # Four options, not ten, so the chance floor is 0.25 against MMLU-Pro's 0.1.
    - name: gpqa_diamond
      path: /data/gpqa/gpqa-diamond-miles.jsonl
      n_samples_per_eval_prompt: 8
